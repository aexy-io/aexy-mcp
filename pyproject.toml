[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aexy-mcp"
version = "1.0.0"
description = "stdio bridge to the Aexy remote MCP server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
aexy-mcp = "aexy_mcp.server:main"
