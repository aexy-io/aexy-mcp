[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aexy-mcp"
version = "0.1.0"
description = "MCP server for the Aexy Engineering OS platform"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "temporalio>=1.7.0",
]

[project.scripts]
aexy-mcp = "aexy_mcp.server:main"
