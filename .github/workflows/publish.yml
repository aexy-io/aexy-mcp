name: Publish to PyPI

# Release flow: bump `version` in pyproject.toml, commit, then push a matching
# tag (`git tag v1.0.1 && git push origin v1.0.1`). The tag must equal the
# pyproject version or the build fails before anything is uploaded.
#
# Authentication is PyPI "trusted publishing" (OIDC) — no API token is stored.
# One-time setup on PyPI: project aexy-mcp -> Publishing -> add GitHub publisher
# with owner `aexy-io`, repository `mcp-server`, workflow `publish.yml`,
# environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --frozen pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aexy-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
